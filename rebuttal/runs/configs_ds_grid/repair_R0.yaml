apiVersion: pact-run/v1
kind: RunConfig

model:
  provider: openai-compatible
  baseUrl: https://openrouter.ai/api/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: deepseek/deepseek-v4-flash-0731
  temperature: 0
  # seed omitted: first-party deepseek endpoint does not support seed
  # (precedent: BaseTen Kimi, 2026-07 sweep)
  providerRouting:
    requireParameters: true
    allowFallbacks: false
    only: [relace, baidu]
  maxOutputTokens: 4096

benchmark:
  dataset: pact-pair
  policy: D2_SUBMITTED
  requester: R0
  gradingMode: category
  execution:
    adapter: sharedos-embedded
  tasks:
    kind: all
    ids: [Q74, Q75, Q76, Q77, Q78, Q202, Q290, A70, A108]

budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 120000

output:
  directory: rebuttal/runs/out/ds_grid_R0_repair
  saveTraces: true

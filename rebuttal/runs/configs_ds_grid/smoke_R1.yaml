apiVersion: pact-run/v1
kind: RunConfig

model:
  provider: openai-compatible
  baseUrl: https://openrouter.ai/api/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: deepseek/deepseek-v4-flash-0731
  temperature: 0
  seed: 20260820
  maxOutputTokens: 4096

benchmark:
  dataset: pact-pair
  policy: D2_SUBMITTED
  requester: R1
  gradingMode: category
  execution:
    adapter: sharedos-embedded
  tasks:
    kind: all
    ids: [Q1, Q2, Q101, Q201, A1, A101]

budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 120000

output:
  directory: rebuttal/runs/out/ds_grid_smoke
  saveTraces: true

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pulse benchmark overview</title>
  <desc id="desc">Overview diagram for the Pulse research benchmark: canonical data source, three task tracks, policy and relationship-memory modes, gold labels, runner commands, and evaluation path.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 2; }
      .panel-soft { fill: #fbfcff; stroke: #d9dee8; stroke-width: 2; }
      .notes { fill: #dff0ff; stroke: #7eb6e8; }
      .todos { fill: #e2f5e9; stroke: #7cc895; }
      .actions { fill: #fff0df; stroke: #e5a560; }
      .purple { fill: #eee8ff; stroke: #a992df; }
      .ink { fill: #1d2433; }
      .muted { fill: #5d677a; }
      .subtle { fill: #7b8496; }
      .white { fill: #ffffff; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 750; letter-spacing: 0; }
      .subtitle { font-size: 18px; font-weight: 500; }
      .h2 { font-size: 23px; font-weight: 740; }
      .h3 { font-size: 17px; font-weight: 720; }
      .body { font-size: 15px; font-weight: 500; }
      .small { font-size: 13px; font-weight: 500; }
      .tiny { font-size: 12px; font-weight: 520; }
      .metric { font-size: 34px; font-weight: 760; }
      .chip-text { font-size: 12px; font-weight: 700; }
      .arrow { stroke: #7d8798; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-strong { stroke: #394255; stroke-width: 3; fill: none; marker-end: url(#arrowhead-strong); }
      .line { stroke: #d8deea; stroke-width: 2; }
      .dash { stroke: #b9c2d1; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#7d8798"/>
    </marker>
    <marker id="arrowhead-strong" markerWidth="13" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L13,4.5 L0,9 Z" fill="#394255"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15203a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text class="sans title ink" x="80" y="78">Pulse Benchmark Data Setup</text>
  <text class="sans subtitle muted" x="82" y="112">600 tasks x 3 policy modes x 2 relationship-memory modes = 3,600 evaluations</text>

  <g transform="translate(1235 48)">
    <rect class="panel-soft" x="0" y="0" width="285" height="82" rx="12"/>
    <text class="sans small subtle" x="20" y="30">Canonical source</text>
    <text class="code body ink" x="20" y="58">research/configs/questions.json</text>
  </g>

  <g transform="translate(80 165)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="300" height="190" rx="14"/>
    <text class="sans h2 ink" x="24" y="42">Seeded World</text>
    <text class="sans body muted" x="24" y="76">Alex's notes, todos, and optional</text>
    <text class="sans body muted" x="24" y="99">native Tina relationship memory.</text>
    <rect class="purple" x="24" y="124" width="252" height="42" rx="8"/>
    <text class="code small ink" x="38" y="151">seed_experiment_groups.ts</text>
  </g>

  <path class="arrow-strong" d="M392 260 C430 260, 446 260, 482 260"/>

  <g transform="translate(500 145)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="600" height="230" rx="16"/>
    <text class="sans h2 ink" x="28" y="44">Canonical Benchmark File</text>
    <text class="code body ink" x="28" y="76">questions.json</text>
    <text class="sans small muted" x="278" y="76">600 base tasks</text>

    <g transform="translate(28 108)">
      <rect class="notes" x="0" y="0" width="164" height="82" rx="12"/>
      <text class="sans metric ink" x="22" y="42">200</text>
      <text class="sans small ink" x="22" y="66">Notes QA</text>
      <text class="code tiny muted" x="99" y="66">Q1-Q200</text>
    </g>

    <g transform="translate(218 108)">
      <rect class="todos" x="0" y="0" width="164" height="82" rx="12"/>
      <text class="sans metric ink" x="22" y="42">200</text>
      <text class="sans small ink" x="22" y="66">Todo QA</text>
      <text class="code tiny muted" x="98" y="66">Q201-Q400</text>
    </g>

    <g transform="translate(408 108)">
      <rect class="actions" x="0" y="0" width="164" height="82" rx="12"/>
      <text class="sans metric ink" x="22" y="42">200</text>
      <text class="sans small ink" x="22" y="66">Actions</text>
      <text class="code tiny muted" x="93" y="66">A1-A200</text>
    </g>
  </g>

  <path class="arrow-strong" d="M1118 260 C1160 260, 1175 260, 1214 260"/>

  <g transform="translate(1235 165)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="285" height="190" rx="14"/>
    <text class="sans h2 ink" x="24" y="42">Experiment Runner</text>
    <rect class="purple" x="24" y="63" width="237" height="42" rx="8"/>
    <text class="code small ink" x="38" y="90">experiment_v2.ts</text>
    <text class="sans body muted" x="24" y="136">Policy modes: P0 / P1 / P2</text>
    <text class="sans body muted" x="24" y="159">Memory modes: absent / native</text>
  </g>

  <g transform="translate(80 430)">
    <rect class="panel" x="0" y="0" width="445" height="305" rx="16"/>
    <rect class="notes" x="22" y="22" width="96" height="34" rx="8"/>
    <text class="sans chip-text ink" x="42" y="44">Notes QA</text>
    <text class="sans h2 ink" x="22" y="92">Q1-Q200</text>
    <text class="sans body muted" x="22" y="122">Long-form note retrieval with privacy</text>
    <text class="sans body muted" x="22" y="145">boundary labels across P0/P1/P2.</text>

    <text class="sans h3 ink" x="22" y="186">Gold fields</text>
    <text class="code small muted" x="22" y="214">source_notes</text>
    <text class="code small muted" x="150" y="214">gold_key_facts</text>
    <text class="code small muted" x="300" y="214">minimum_correct</text>

    <text class="sans h3 ink" x="22" y="255">Category counts</text>
    <rect x="22" y="274" width="210" height="16" rx="8" fill="#6fa8dc"/>
    <rect x="232" y="274" width="63" height="16" fill="#e07a5f"/>
    <rect x="295" y="274" width="53" height="16" fill="#7d6fb2"/>
    <rect x="348" y="274" width="42" height="16" fill="#4d908e"/>
    <rect x="390" y="274" width="52" height="16" rx="8" fill="#d6a04d"/>
    <text class="sans tiny subtle" x="22" y="306">100 public / 100 sensitive+personal</text>
  </g>

  <g transform="translate(578 430)">
    <rect class="panel" x="0" y="0" width="445" height="305" rx="16"/>
    <rect class="todos" x="22" y="22" width="96" height="34" rx="8"/>
    <text class="sans chip-text ink" x="43" y="44">Todo QA</text>
    <text class="sans h2 ink" x="22" y="92">Q201-Q400</text>
    <text class="sans body muted" x="22" y="122">Task-state retrieval across correlated</text>
    <text class="sans body muted" x="22" y="145">and todo-only sensitive cases.</text>

    <text class="sans h3 ink" x="22" y="186">Gold fields</text>
    <text class="code small muted" x="22" y="214">source_todos</text>
    <text class="code small muted" x="150" y="214">gold_key_facts</text>
    <text class="code small muted" x="300" y="214">minimum_correct</text>

    <text class="sans h3 ink" x="22" y="255">Range structure</text>
    <text class="sans tiny subtle" x="22" y="282">Q201-Q300 correlated, Q301-Q400 todo-only</text>
    <text class="sans tiny subtle" x="22" y="306">100 public / 100 sensitive+personal</text>
  </g>

  <g transform="translate(1075 430)">
    <rect class="panel" x="0" y="0" width="445" height="305" rx="16"/>
    <rect class="actions" x="22" y="22" width="100" height="34" rx="8"/>
    <text class="sans chip-text ink" x="44" y="44">Actions</text>
    <text class="sans h2 ink" x="22" y="92">A1-A200</text>
    <text class="sans body muted" x="22" y="122">State-changing note/todo mutations with</text>
    <text class="sans body muted" x="22" y="145">explicit execute/refuse labels.</text>

    <text class="sans h3 ink" x="22" y="186">Gold fields</text>
    <text class="code small muted" x="22" y="214">instruction</text>
    <text class="code small muted" x="147" y="214">expected_verdict</text>
    <text class="code small muted" x="305" y="214">gold_check</text>

    <text class="sans h3 ink" x="22" y="255">Balanced axes</text>
    <rect x="22" y="272" width="185" height="28" rx="8" fill="#f5c38b"/>
    <text class="sans tiny ink" x="43" y="291">100 execute / 100 refuse</text>
    <rect x="224" y="272" width="178" height="28" rx="8" fill="#f5c38b"/>
    <text class="sans tiny ink" x="247" y="291">100 notes / 100 todos</text>
  </g>

  <path class="dash" d="M302 376 V410"/>
  <path class="dash" d="M800 376 V410"/>
  <path class="dash" d="M1298 376 V410"/>

  <g transform="translate(80 800)">
    <rect class="panel-soft" x="0" y="0" width="910" height="138" rx="16"/>
    <text class="sans h2 ink" x="24" y="41">Subset Runs</text>
    <text class="sans body muted" x="24" y="73">The runner filters by id range, so track selection is deterministic.</text>

    <g transform="translate(24 94)">
      <rect class="notes" x="0" y="-21" width="94" height="30" rx="7"/>
      <text class="sans tiny ink" x="19" y="-2">Notes QA</text>
      <text class="code small ink" x="112" y="0">single-all --from 1 --to 200</text>
    </g>
    <g transform="translate(355 94)">
      <rect class="todos" x="0" y="-21" width="94" height="30" rx="7"/>
      <text class="sans tiny ink" x="22" y="-2">Todo QA</text>
      <text class="code small ink" x="112" y="0">single-all --from 201 --to 400</text>
    </g>
    <g transform="translate(692 94)">
      <rect class="actions" x="0" y="-21" width="82" height="30" rx="7"/>
      <text class="sans tiny ink" x="21" y="-2">Actions</text>
      <text class="code small ink" x="99" y="0">action-all --from 1 --to 200</text>
    </g>
  </g>

  <g transform="translate(1030 800)">
    <rect class="panel-soft" x="0" y="0" width="490" height="138" rx="16"/>
    <text class="sans h2 ink" x="24" y="41">Evaluation Matrix</text>
    <text class="code small ink" x="24" y="73">600 x 3 x 2 = 3,600 evals</text>
    <path class="arrow" d="M248 68 H298"/>
    <text class="code small ink" x="315" y="73">automated_eval.ts</text>
    <line class="line" x1="24" y1="94" x2="466" y2="94"/>
    <text class="sans small muted" x="24" y="120">P0/P1/P2 crossed with absent/native relationship memory.</text>
  </g>

  <text class="sans tiny subtle" x="80" y="974">Figure source: research/configs/benchmark_overview.svg. Data source: research/configs/questions.json.</text>
</svg>

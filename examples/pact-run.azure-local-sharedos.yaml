# Real-model (Azure OpenAI v1 API) config for the LOCAL backend with the
# execution path routed through the REAL SharedOS kernel
# (benchmark.execution.adapter: sharedos-embedded) — a single-task smoke.
#
# Prerequisites, in addition to pact-run.azure-local.yaml's setup:
#   - a built SharedOS checkout reachable via PACT_SHAREDOS_DIR
#     (default: ../sharedos-repo next to this repository)
#
#   1. export PACT_MODEL_API_KEY="<your-azure-openai-key>"   # never commit this
#   2. edit endpoint + deployment below to match your resource
#   3. npm run benchmark -- --config examples/pact-run.azure-local-sharedos.yaml --check
#   4. npm run benchmark -- --config examples/pact-run.azure-local-sharedos.yaml
#
# Every trial's decisions then execute as one bounded SharedOS turn: grants
# are host-constructed per trial from the granted boundary plan, tools run
# through the kernel's filtered registry and invocation gate, and each
# result row carries adapterId: sharedos-embedded plus the kernel's
# runtime/audit events in the private trace artifact (saveTraces: true).
apiVersion: pact-run/v1
kind: RunConfig
backend:
  kind: local
model:
  provider: azure-openai
  endpoint: https://your-resource.openai.azure.com/openai/v1
  deployment: your-deployment-name
  apiKeyEnv: PACT_MODEL_API_KEY
  maxOutputTokens: 4096
benchmark:
  policy: D2
  requester: R1
  tasks:
    kind: all
    ids: [PAIR-Q1]
  execution:
    adapter: sharedos-embedded
budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 60000
output:
  directory: runs
  saveTraces: true

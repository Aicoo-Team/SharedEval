apiVersion: pact-run/v1
kind: RunConfig
backend:
  kind: harbor
  concurrency: 3
model:
  provider: openai-compatible
  baseUrl: https://scripted.invalid/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: pact-scripted-parity-v1
  maxOutputTokens: 256
benchmark:
  policy: D2
  requester: R1
  tasks:
    kind: all
    ids: [PAIR-Q1, PAIR-Q101, PAIR-Q201, PAIR-A1, PAIR-A21, PAIR-A41]
budget:
  maxTurns: 4
  maxToolCalls: 2
  maxRuntimeMs: 30000
output:
  directory: runs
  saveTraces: true

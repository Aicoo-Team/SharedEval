apiVersion: pact-run/v1
kind: RunConfig

model:
  provider: openai-compatible
  baseUrl: https://api.openai.com/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: gpt-5-mini
  maxOutputTokens: 4096

execution:
  adapter: sharedos-embedded

benchmark:
  dataset: pact-pair
  policy: D2_SUBMITTED
  requester: R1
  gradingMode: category
  tasks:
    kind: qa
    ids: [Q1]

budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 60000

output:
  directory: runs
  saveTraces: true

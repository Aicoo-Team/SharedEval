# Deterministic PACT-Net Harbor smoke: the scripted `.invalid` endpoint marks
# every task package as no-network parity (allow_internet = false); the
# containers run the bundled scripted PACT-Net harness and never call a model.
# Covers the same seven scripted tasks as the local Net scripted suite:
# answer, refusal, filtered answer, routing-blocked probe, authorized create,
# authorized complete, and refused mutation.
apiVersion: pact-run/v1
kind: RunConfig
backend:
  kind: harbor
  concurrency: 3
model:
  provider: openai-compatible
  baseUrl: https://scripted.invalid/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: pact-scripted-parity-v1
  maxOutputTokens: 256
benchmark:
  dataset: pact-net
  policy: D2
  tasks:
    kind: all
    ids: [NET-Q-0001, NET-Q-0010, NET-Q-0015, NET-Q-0021, NET-A-0001, NET-A-0009, NET-A-0014]
budget:
  maxTurns: 4
  maxToolCalls: 2
  maxRuntimeMs: 30000
output:
  directory: runs
  saveTraces: true

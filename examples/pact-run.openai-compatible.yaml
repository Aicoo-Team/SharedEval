apiVersion: pact-run/v1
kind: RunConfig

model:
  provider: openai-compatible
  baseUrl: https://api.openai.com/v1
  apiKeyEnv: PACT_MODEL_API_KEY
  model: gpt-5-mini
  maxOutputTokens: 4096

benchmark:
  policy: D2
  requester: R1
  tasks:
    kind: all
    ids: [Q1, A1]

budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 60000

output:
  directory: runs
  saveTraces: false

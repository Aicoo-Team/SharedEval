apiVersion: pact-bench/v1
kind: Submission
id: typescript-basic
name: TypeScript basic starter
version: 0.1.0
description: A deterministic starter that demonstrates the PACT Adapter v1 lifecycle.
track: pact-pair
mode: pair-responder
submitter:
  organization: PACT-Bench contributors
model:
  provider: local
  name: deterministic-rule-based-demo
  temperature: 0
agent:
  architecture: typescript-rule-based-starter
  repository: https://github.com/xisen-w/PACT
  revision: main
capabilities:
  - answer
  - refuse
  - tool_call
  - escalate
runtime:
  kind: docker
  protocol: jsonrpc-stdio/v1
  source:
    kind: build
    context: .
    dockerfile: examples/submissions/typescript-basic/Dockerfile
  network: disabled
declarations:
  usesExternalServices: false
  usesExternalTools: true
  usesPersistentMemory: false
  frameworks:
    - typescript
  notes: This starter is a protocol example, not a competitive privacy policy.

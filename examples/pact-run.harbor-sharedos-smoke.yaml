# Real-model Harbor smoke with the execution path routed through the REAL
# SharedOS kernel (benchmark.execution.adapter: sharedos-embedded) — the
# containerized counterpart of pact-run.azure-local-sharedos.yaml.
#
# Prerequisites:
#   - Docker daemon + Harbor 0.5.0 (uv tool install harbor==0.5.0)
#   - a built SharedOS checkout on the HOST (PACT_SHAREDOS_DIR, default
#     ../sharedos-repo); its packages/*/dist are staged and COPY'd into the
#     image — never cloned or built inside the container
#   - export PACT_MODEL_API_KEY (runtime-only; Harbor injects it into the
#     container process at trial start — O-003 decision 1)
#   - macOS + VM-based Docker (colima): export TMPDIR to a Docker-shared
#     path under $HOME first (see docs/running.md)
#
# Egress narrows to the configured model endpoint host over HTTPS 443
# (O-003 decision 2); scripted parity packages stay strictly no-network.
apiVersion: pact-run/v1
kind: RunConfig
backend:
  kind: harbor
  concurrency: 3
model:
  provider: azure-openai
  endpoint: https://your-resource.openai.azure.com/openai/v1
  deployment: your-deployment-name
  apiKeyEnv: PACT_MODEL_API_KEY
  maxOutputTokens: 4096
benchmark:
  policy: D2
  requester: R1
  tasks:
    kind: all
    ids: [PAIR-Q1, PAIR-Q101, PAIR-Q201, PAIR-A1, PAIR-A21, PAIR-A41]
  execution:
    adapter: sharedos-embedded
budget:
  maxTurns: 8
  maxToolCalls: 4
  maxRuntimeMs: 60000
output:
  directory: runs
  saveTraces: true

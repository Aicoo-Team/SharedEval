name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate benchmark catalog
        run: npm run validate

      - name: Smoke-test PACT-Pair data and evaluation
        run: npm run smoke:pact-pair

      - name: Smoke-test PACT-Net data and evaluation
        run: npm run smoke:pact-net

      - name: Verify deterministic Hugging Face export
        run: |
          first="${RUNNER_TEMP}/pact-hf-a"
          second="${RUNNER_TEMP}/pact-hf-b"
          node scripts/huggingface/export-pact-pair.mjs --output "$first"
          node scripts/huggingface/export-pact-pair.mjs --output "$second"
          diff -ru "$first" "$second"
          test "$(wc -l < "$first/data/pair/validation.jsonl")" -eq 600

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

  sharedos-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHAREDOS_PIN: a303d97fe974c149d4575b1f5d6426aee6f37367

    steps:
      - name: Require SharedOS checkout token
        env:
          SHAREDOS_CHECKOUT_TOKEN: ${{ secrets.SHAREDOS_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$SHAREDOS_CHECKOUT_TOKEN" ]; then
            echo "::error::SHAREDOS_CHECKOUT_TOKEN must read Aicoo-Team/SharedOS."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned SharedOS
        uses: actions/checkout@v4
        with:
          repository: Aicoo-Team/SharedOS
          ref: ${{ env.SHAREDOS_PIN }}
          token: ${{ secrets.SHAREDOS_CHECKOUT_TOKEN }}
          path: sharedos-repo
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SharedEval dependencies
        run: npm ci

      - name: Build SharedOS
        working-directory: sharedos-repo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify the pinned SharedOS boundary
        env:
          SHAREDEVAL_SHAREDOS_DIR: ${{ github.workspace }}/sharedos-repo
          SHAREDEVAL_REQUIRE_SHAREDOS: '1'
        run: npm run test:sharedos

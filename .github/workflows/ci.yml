name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate benchmark catalog
        run: npm run validate

      - name: Smoke-test PACT-Pair data and evaluation
        run: npm run smoke:pact-pair

      - name: Smoke-test PACT-Net data and evaluation
        run: npm run smoke:pact-net

      - name: Verify deterministic Hugging Face export
        run: |
          first="${RUNNER_TEMP}/pact-hf-a"
          second="${RUNNER_TEMP}/pact-hf-b"
          node scripts/huggingface/export-pact-pair.mjs --output "$first"
          node scripts/huggingface/export-pact-pair.mjs --output "$second"
          diff -ru "$first" "$second"
          test "$(wc -l < "$first/data/pair/validation.jsonl")" -eq 600

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

  sharedos-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHAREDOS_PIN: 3aa07e33999b656a10ace294fd4e41df8cbc318e

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned SharedOS
        uses: actions/checkout@v4
        with:
          repository: Aicoo-Team/SharedOS
          ref: ${{ env.SHAREDOS_PIN }}
          path: sharedos-repo
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install SharedEval dependencies
        run: npm ci

      - name: Build SharedOS
        working-directory: sharedos-repo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify the pinned SharedOS boundary
        env:
          SHAREDEVAL_SHAREDOS_DIR: ${{ github.workspace }}/sharedos-repo
          SHAREDEVAL_REQUIRE_SHAREDOS: '1'
        run: npm run test:sharedos

      - name: Verify native world continuity and failure lifecycle
        env:
          SHAREDEVAL_SHAREDOS_DIR: ${{ github.workspace }}/sharedos-repo
          SHAREDEVAL_REQUIRE_SHAREDOS: '1'
        run: npm exec -- tsx --test tests/runner-v1/world-native-conformance.test.ts tests/runner-v1/world-failure-lifecycle.test.ts tests/execution/pair-late-operation-driver.test.ts tests/execution/pair-late-operation-delivery.test.ts
